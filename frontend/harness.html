<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>body{margin:0;font-family:monospace;font-size:9px;}#report{position:fixed;top:0;left:0;right:0;background:#fff;color:#000;padding:4px;z-index:9999;border-bottom:2px solid #000;max-height:95%;overflow:auto;white-space:pre-wrap;}</style></head>
<body>
<div id="report">loading...</div>
<iframe id="f" src="index.html" style="width:320px;height:568px;border:0;opacity:0.01;"></iframe>
<script>
const f=document.getElementById('f');
function run(){
  try{
    const doc=f.contentDocument;
    if(!doc || !doc.querySelector('.property-grid')){ document.getElementById('report').textContent='not ready'; setTimeout(run,300); return;}
    const report=[];
    doc.querySelectorAll('.property-meta').forEach((ul,i)=>{
      const lis=Array.from(ul.querySelectorAll('li'));
      report.push('Card'+(i+1)+' meta li count='+lis.length);
      lis.forEach((li,idx)=>{
        const r=li.getBoundingClientRect();
        report.push('  li'+(idx+1)+' "'+li.textContent.trim()+'" w='+Math.round(r.width)+' h='+Math.round(r.height)+' top='+Math.round(r.top)+' left='+Math.round(r.left)+' visible='+(r.width>0&&r.height>0));
      });
    });
    doc.querySelectorAll('.property-foot').forEach((pf,i)=>{
      const r=pf.getBoundingClientRect();
      report.push('Card'+(i+1)+' foot w='+Math.round(r.width)+' h='+Math.round(r.height));
      Array.from(pf.children).forEach(c=>{const r2=c.getBoundingClientRect();report.push('   child '+c.className+' w='+Math.round(r2.width)+' h='+Math.round(r2.height));});
    });
    const clipped=[];
    Array.from(doc.querySelectorAll('.property-card *')).forEach(el=>{
      const cs=doc.defaultView.getComputedStyle(el);
      const r=el.getBoundingClientRect();
      if(r.width>0 && r.height>0 && ((cs.overflow==='hidden'||cs.overflowX==='hidden') || cs.whiteSpace==='nowrap')){
        clipped.push(el.tagName+'.'+el.className+' | ov:'+cs.overflow+'/'+cs.overflowX+' | ws:'+cs.whiteSpace+' | w:'+Math.round(r.width));
      }
    });
    report.push('--- clipped/nowrap in cards ---');
    report.push(...clipped);
    document.getElementById('report').innerHTML=report.join('<br>');
  }catch(e){ document.getElementById('report').textContent='ERROR: '+e; }
}
f.addEventListener('load',()=>setTimeout(run,500));
setTimeout(run,1000);
</script>
</body></html>
